<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In</title>
  <link rel="stylesheet" href="./style-create-sinnin.css">
</head>
<body>

  <div class="container">
    <div class="login-box">
      <h2>Sign In</h2>

      <form>
        <div class="input-box">
          <input type="text" placeholder="Username or Email" required>
        </div>

        <div class="input-box">
          <input type="password" placeholder="Password" required>
        </div>

        <div class="remember">
          <label>
            <input type="checkbox"> Remember me
          </label>
        </div>

        <button type="submit">Login</button>

        <p class="register">
          Don't have an account? <a href="#">Sign Up</a>
        </p>
      </form>

    </div>
  </div>

</body>
</html>
